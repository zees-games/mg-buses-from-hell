# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the client bench has no map switch, so "bowl" is the real client against the real server and module on the default bowl.
PERF_CASES=bowl
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is a tools/shot.sh view flag (plan: the bowl from above, deck: the runner on the deck); each leaves screenshots/<case>_view.png.
VISUAL_CASES="plan deck"
VISUAL_SHOTS="view"

visual_render() { heavy -- timeout 300 tools/shot.sh 9 "${1}_view.png" "--$1"; }
